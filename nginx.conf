server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: route apa pun yang bukan file statis diarahkan ke
    # index.html supaya vue-router (history mode) nggak 404 saat direfresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }
}
