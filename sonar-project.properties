# SonarQube project definition for the frontend repo.
# One Sonar project per repo: backend = powerbind-backend (Java + JaCoCo),
# frontend = powerbind-frontend (this one). Run via .\run-sonar.ps1.
sonar.projectKey=powerbind-frontend
sonar.projectName=powerbind-frontend

# Source & exclusions — ignore build output and dependencies
sonar.sources=src
sonar.exclusions=src/**/*.test.js,src/**/*.spec.js,dist/**,node_modules/**
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.spec.js

# Coverage — lcov report produced by `npx vitest run --coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info
